<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기획 워크벤치</title>
  <meta name="description" content="게임 시스템·BM 기획 검증 도구 모음 — 강화 확률·비용, 가챠·수집, 성장 표 엑셀 템플릿, 스탯·전투 승률, 패턴 프레임 검증">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M9 22l5-12 4 8 2-4 3 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 테마를 첫 렌더 전에 적용해 깜빡임 방지. 처음에는 라이트, 버튼으로 고른 적이 있으면 그 테마
    try { const t = localStorage.getItem('planwb:theme'); document.documentElement.dataset.theme = t ? JSON.parse(t) : 'light'; } catch {}
  </script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#enhance" id="brand-home" title="처음 화면으로">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <strong>기획 워크벤치</strong>
        <span class="brand-sub">게임 시스템 기획 검증 도구</span>
      </div>
    </a>
    <!-- 분류별 메뉴: 마우스를 올리거나(키보드는 포커스·↓) 누르면 그 분류의 도구 목록이 열린다 -->
    <nav class="tabs" aria-label="도구">
      <div class="nav-group" data-group="bm">
        <button class="nav-trigger" type="button" aria-haspopup="true" aria-expanded="false">BM·성장<span class="nav-cur"></span><span class="nav-caret" aria-hidden="true"></span></button>
        <div class="nav-menu">
          <button type="button" data-tab="enhance"><b>강화 확률 설계</b><span>확률·비용·파괴, 보조 아이템 가격</span></button>
          <button type="button" data-tab="gacha"><b>가챠·수집 설계</b><span>천장·픽업·마일리지, 확률 공시표</span></button>
          <button type="button" data-tab="growth"><b>성장 표 템플릿 (엑셀)</b><span>레벨 곡선·공급원 → 수식이 살아 있는 .xlsx</span></button>
        </div>
      </div>
      <div class="nav-group" data-group="combat">
        <button class="nav-trigger" type="button" aria-haspopup="true" aria-expanded="false">전투 밸런스<span class="nav-cur"></span><span class="nav-caret" aria-hidden="true"></span></button>
        <div class="nav-menu">
          <button type="button" data-tab="battle"><b>스탯·전투</b><span>레벨별 CP와 1:1 승률, 특성</span></button>
          <button type="button" data-tab="frame"><b>패턴 프레임 검증</b><span>회피 윈도우·반응·반격 판정</span></button>
        </div>
      </div>
      <button class="nav-direct" type="button" data-tab="brief">브리핑</button>
      <span class="tab-sep" aria-hidden="true"></span>
      <button class="nav-direct tab-extra" type="button" data-tab="diagram" title="부가 도구 — 자연어로 다이어그램">다이어그램</button>
      <a class="nav-direct tab-extra" href="pdf/" title="부가 도구 — 브라우저 안에서만 처리하는 PDF 편집">PDF</a>
    </nav>
    <a class="header-link extra-link" href="landing/" title="도구 소개 페이지 — 도구별 계산 방법·검증·사례">소개</a>
    <div class="undo-group" role="group" aria-label="되돌리기">
      <button class="icon-btn" id="undo-btn" type="button" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon-btn" id="redo-btn" type="button" title="다시 하기 (Ctrl+Shift+Z)" aria-label="다시 하기" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <button class="btn small snap-btn" id="snap-open" type="button" title="모든 탭 설정을 저장·비교·되돌리기">스냅샷</button>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="테마 전환" title="테마 전환">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </header>

  <main>
    <section id="tab-enhance" role="tabpanel" class="panel"></section>
    <section id="tab-gacha" role="tabpanel" class="panel" hidden></section>
    <section id="tab-growth" role="tabpanel" class="panel" hidden></section>
    <section id="tab-battle" role="tabpanel" class="panel" hidden></section>
    <section id="tab-frame" role="tabpanel" class="panel" hidden></section>
    <section id="tab-brief" role="tabpanel" class="panel" hidden></section>
    <section id="tab-diagram" role="tabpanel" class="panel" hidden></section>
  </main>

  <footer class="app-footer">
    <span>모든 계산은 브라우저 안에서만 실행됩니다 · 서버 전송 없음</span>
    <span>템플릿 수치는 설계 예시입니다</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
